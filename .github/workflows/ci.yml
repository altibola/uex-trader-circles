name: CI Build & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Core Tests
        run: pnpm test

      - name: Build Core & Extension
        run: pnpm build

      - name: Package Extensions (Chrome, Firefox, Safari)
        run: pnpm package

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: apps/extension/dist/*.zip
