name: Release Extension Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1)'
        required: true
        default: 'v0.1'

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm test

      - name: Build & Package v0.1 Distributions
        run: |
          pnpm build
          pnpm package

      - name: Convert Safari App Extension
        run: |
          bash apps/extension/dist/convert-safari.sh || true

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Release ${{ github.event.inputs.version || github.ref_name }}
          files: |
            apps/extension/dist/uex-trader-circles-v0.1-chrome.zip
            apps/extension/dist/uex-trader-circles-v0.1-firefox.zip
            apps/extension/dist/uex-trader-circles-v0.1-safari.zip
          draft: false
          prerelease: false
